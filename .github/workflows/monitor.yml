name: war-monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # هر ۵ دقیقه (UTC)
  workflow_dispatch: {}

concurrency:
  group: war-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet requests

      - name: Run monitor (news + FX)
        run: python monitor.py

      - name: Commit & push results
        run: |
          git config user.name "war-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          # جلوگیری از شکستن push وقتی همزمان commit دیگه‌ای رفته
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git add -A items.jsonl state.json fx.jsonl digest.txt
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "update: $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            for i in 1 2 3; do
              git push && exit 0
              git pull --rebase --autostash origin "$GITHUB_REF_NAME"
              sleep 5
            done
            git push
          fi
